<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="supervisorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Laurel Gradient -->
    <linearGradient id="emeraldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#supervisorBg)" />

  <!-- Outer Golden Border Ring -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#goldAcc)" stroke-width="4.5" stroke-opacity="0.75" />

  <!-- Inner Soft Pattern -->
  <circle cx="256" cy="180" r="160" fill="#38bdf8" fill-opacity="0.08" />

  <!-- Main Shield Motif -->
  <g filter="url(#cardShadow)">
    <!-- Heraldic Shield Outline -->
    <path d="M 256 65 Q 360 85 385 155 Q 385 285 256 365 Q 127 285 127 155 Q 152 85 256 65 Z"
          fill="#1e293b" stroke="url(#goldAcc)" stroke-width="7" stroke-linejoin="round" />

    <!-- Inner Shield Infill -->
    <path d="M 256 82 Q 345 100 365 160 Q 365 270 256 345 Q 147 270 147 160 Q 167 100 256 82 Z"
          fill="#0f172a" fill-opacity="0.9" />

    <!-- Scales of Law & Educational Vigilance -->
    <!-- Scales Beam -->
    <path d="M 185 155 Q 256 142 327 155" stroke="url(#goldAcc)" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="256" cy="148" r="9" fill="#facc15" stroke="#ffffff" stroke-width="2" />

    <!-- Central Pillar -->
    <line x1="256" y1="148" x2="256" y2="255" stroke="url(#goldAcc)" stroke-width="5" stroke-linecap="round" />
    <polygon points="256,120 250,135 262,135" fill="url(#goldAcc)" />

    <!-- Left Balance Pan -->
    <line x1="185" y1="155" x2="162" y2="198" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="185" y1="155" x2="208" y2="198" stroke="#cbd5e1" stroke-width="2.5" />
    <path d="M 152 198 Q 185 218 218 198 Z" fill="url(#goldAcc)" stroke="#ca8a04" stroke-width="2" />

    <!-- Right Balance Pan -->
    <line x1="327" y1="155" x2="304" y2="198" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="327" y1="155" x2="350" y2="198" stroke="#cbd5e1" stroke-width="2.5" />
    <path d="M 294 198 Q 327 218 360 198 Z" fill="url(#goldAcc)" stroke="#ca8a04" stroke-width="2" />

    <!-- Open Educational Book at Base of Shield -->
    <path d="M 180 270 Q 256 248 256 295 Q 256 248 332 270 L 332 305 Q 256 283 256 325 Q 256 283 180 305 Z"
          fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <path d="M 256 252 L 256 325" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

    <!-- Quill / Pen Symbolizing Administrative Documentation -->
    <g transform="translate(256, 215) rotate(42)">
      <path d="M 0 0 L 8 -55 Q 0 -68 -8 -55 L 0 0 Z" fill="url(#goldAcc)" />
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#78350f" stroke-width="1.5" />
    </g>
  </g>

  <!-- Algerian Emblem Stars Accent -->
  <circle cx="218" cy="100" r="4" fill="#ef4444" />
  <circle cx="294" cy="100" r="4" fill="#ef4444" />
  <polygon points="256,92 258,98 264,98 259,102 261,108 256,104 251,108 253,102 248,98 254,98" fill="#ef4444" />

  <!-- Badge Banner: 20 بطاقة معالجة ميدانية -->
  <g transform="translate(256, 400)">
    <!-- Banner Pill Outer -->
    <rect x="-170" y="-22" width="340" height="46" rx="23" fill="#facc15" stroke="#b45309" stroke-width="2.5" filter="url(#cardShadow)" />
    <!-- Banner Pill Inner -->
    <rect x="-165" y="-18" width="330" height="38" rx="19" fill="#1e3a8a" />
    
    <text x="0" y="7" text-anchor="middle" fill="#fef08a" font-family="'Cairo', system-ui, sans-serif" font-weight="900" font-size="19" letter-spacing="0.5">
      دليل الإشراف الميداني (20 بطاقة)
    </text>
  </g>

  <!-- Subtitle Bottom: ثانوية ابن الهيثم التقنية -->
  <text x="256" y="462" text-anchor="middle" fill="#cbd5e1" font-family="'Cairo', system-ui, sans-serif" font-weight="700" font-size="14">
    مصلحة الاستشارة التربوية • 2026/2027
  </text>
</svg>
